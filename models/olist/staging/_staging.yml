version: 2

models:
  - name: stg_orders
    description: "Cleaned orders data from Olist"
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null

  - name: stg_customers
    description: "Cleaned customers data from Olist"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_order_items
    description: "Cleaned order items data from Olist"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null

  - name: stg_products
    description: "Cleaned products data from Olist"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_sellers
    description: "Cleaned sellers data from Olist"
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: stg_order_payments
    description: "Cleaned order payments data from Olist"
    columns:
      - name: order_id
        tests:
          - not_null

  - name: stg_order_reviews
    description: "Cleaned order reviews data from Olist"
    columns:
      - name: review_id
        tests:
          - not_null
      - name: review_score
        tests:
          - not_null

  - name: stg_category_translation
    description: "Product category name translation from Portuguese to English"
    columns:
      - name: product_category_name
        tests:
          - unique
          - not_null